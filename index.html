<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2F5597">
  <meta name="description" content="TiendaClara: inventario, ventas y fiado para tiendas de barrio. Funciona sin internet.">
  <title>TiendaClara</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icons/icon-192.png" alt="" width="28" height="28"><span id="nombre-tienda">TiendaClara</span></div>
    <span id="estado-red" class="pill" title="Estado de la conexión"></span>
  </header>

  <main id="vista" tabindex="-1" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Navegación principal">
    <a href="#/vender" data-tab="vender"><span class="ico" aria-hidden="true">🛒</span>Vender</a>
    <a href="#/inventario" data-tab="inventario"><span class="ico" aria-hidden="true">📦</span>Inventario</a>
    <a href="#/fiado" data-tab="fiado"><span class="ico" aria-hidden="true">📒</span>Fiado</a>
    <a href="#/tablero" data-tab="tablero"><span class="ico" aria-hidden="true">📊</span>Tablero</a>
    <a href="#/mas" data-tab="mas"><span class="ico" aria-hidden="true">☰</span>Más</a>
  </nav>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true"><div class="modal-card" id="modal-card"></div></div>
  <div id="toast" class="toast" hidden role="status"></div>

  <noscript>TiendaClara necesita JavaScript activado.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
